<section class="project reveal">
  <div class="project-head">
    <span class="project-index">{{ indexLabel }}</span>
    <div>
      <h2>{{ project.title }}</h2>
      <div class="status-row">
        <span class="dot" [class.dot-live]="project.status === 'live'" [class.dot-progress]="project.status === 'progress'"></span>
        {{ statusLabel }}
        <a *ngIf="project.githubUrl" class="p-link" [href]="project.githubUrl" target="_blank" rel="noopener" title="GitHub">GH</a>
        <a *ngIf="project.docsUrl" class="p-link" [href]="project.docsUrl" title="Docs">Dc</a>
      </div>
    </div>
  </div>

  <p class="project-description">{{ project.description }}</p>

  <ul class="tech-stack" *ngIf="project.techStack?.length">
    <li *ngFor="let tech of project.techStack">{{ tech }}</li>
  </ul>

  <app-project-gallery *ngIf="project.images?.length; else noImage" [images]="project.images" />
  <ng-template #noImage>
    <div class="no-image">
      <span>Noch kein Bild</span>
    </div>
  </ng-template>
</section>
